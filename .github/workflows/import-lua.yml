name: Import Lua archive

on:
  push:
    paths:
      - ".import/xz_009.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Lua archive
        run: |
          cat .import/xz_*.b64 > /tmp/lua.tar.xz.b64
          base64 -d /tmp/lua.tar.xz.b64 > /tmp/lua.tar.xz
          xz -dc /tmp/lua.tar.xz > /tmp/lua.tar
          tar -xf /tmp/lua.tar -C .
          rm -rf .import

      - name: Commit imported scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Lua scripts from ChatGPT archive"
          git push
